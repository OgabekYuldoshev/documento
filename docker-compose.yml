# Production stack: Caddy (TLS + SPA + proxy) -> API (Hono/tRPC) with SQLite and files on one volume.
#   cp .env.docker.example .env   # fill in DOMAIN, BETTER_AUTH_SECRET and the superadmin
#   docker compose up -d --build
name: documento

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # The browser origin: cookies, CORS and Better Auth links are built from it.
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      BETTER_AUTH_URL: https://${DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      SEED_SUPERADMIN_NAME: ${SEED_SUPERADMIN_NAME:-Super Admin}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:?set SEED_SUPERADMIN_EMAIL in .env}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:?set SEED_SUPERADMIN_PASSWORD in .env}
      # Rendering
      RENDER_MEMORY_BUDGET_MB: ${RENDER_MEMORY_BUDGET_MB:-2560}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-4}
      PDF_RETENTION_DAYS: ${PDF_RETENTION_DAYS:-1}
      PDF_RETENTION_MAX_DAYS: ${PDF_RETENTION_MAX_DAYS:-30}
      # Limits and retention
      ASSET_MAX_MB: ${ASSET_MAX_MB:-10}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-25}
      UPLOAD_PROJECT_QUOTA_MB: ${UPLOAD_PROJECT_QUOTA_MB:-1024}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      WEBHOOK_LOG_RETENTION_DAYS: ${WEBHOOK_LOG_RETENTION_DAYS:-30}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
    volumes:
      # SQLite database, uploaded assets, generated PDFs.
      - data:/data
      # Optional extra Typst fonts: drop .ttf/.otf files into ./fonts (read-only, scanned recursively).
      - ./fonts:/fonts/custom:ro
    # Reachable only through the web container.
    expose:
      - "3001"
    # The render memory budget (RENDER_MEMORY_BUDGET_MB) plus the Node process must fit in here.
    mem_limit: ${API_MEM_LIMIT:-4g}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Certificates: losing this volume means re-issuing them.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
